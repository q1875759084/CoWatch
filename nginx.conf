server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # nginx 层不做业务级大小限制，设 8G 作为粗粒度防御上限（防异常超大请求）
    # 业务精细限制（如视频单文件 4GB）由后端各接口自行控制，nginx 不感知具体业务边界
    client_max_body_size 8192M;

    # ==================== 反向代理：WebSocket 连接 ====================
    #
    # WebSocket 升级协议必须显式透传 Upgrade / Connection 头，
    # 否则 nginx 默认按 HTTP/1.0 处理，会把 Connection: close 发给后端，
    # 导致后端拒绝 WebSocket 握手。
    #
    # proxy_read_timeout 设为 1 小时，防止 nginx 对长连接超时断开。
    # 复盘 session 预期持续 1-2 小时，超时会导致所有成员同时掉线。
    #
    location /socket {
        proxy_pass http://backend:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        # WebSocket 长连接超时：1 小时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ==================== 反向代理：监控上报与查询 ====================
    #
    # monitor-backend 独立部署，nginx 容器通过环境变量 MONITOR_BACKEND_URL 寻址。
    # 本地开发不走 Docker，浏览器直连 localhost:3100，此配置不生效。
    #
    # MONITOR_BACKEND_URL 由 infra 仓库的 docker-compose.dev.yml / prod.yml 注入：
    #   测试环境：http://host-gateway:3101（monitor-backend 测试实例）
    #   生产环境：http://host-gateway:3100（monitor-backend 生产实例）
    #
    # nginx 镜像启动时通过 envsubst 将占位符替换为实际值（见 Dockerfile）
    #
    location /monitor/ {
        proxy_pass ${MONITOR_BACKEND_URL};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    # ==================== 反向代理：其他 API 请求 ====================
    #
    # 端口 3002 与 docker-compose.yml 中 BACKEND_PORT 默认值保持一致
    # nginx.conf 是静态文件，无法读取 compose 环境变量，因此此处硬编码
    # 若需修改端口，必须同步修改：nginx.conf（此处）+ compose BACKEND_PORT 默认值
    #
    location /api/ {
        proxy_pass http://backend:3002;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        # 视频上传（upload-proxy）需要等待后端将文件写入 COS 后才响应，
        # 文件越大等待时间越长，与 /socket 保持一致设 1 小时兜底
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ==================== SPA 路由兜底 ====================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==================== 静态资源：长期强缓存 ====================
    # Webpack contenthash 确保内容变了 URL 就变，故可永久缓存
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ==================== index.html：协商缓存 ====================
    # HTML 不能强缓存，否则更新后用户拿到旧 JS 引用
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
