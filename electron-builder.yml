# electron-builder 打包配置
# 文档：https://www.electron.build/configuration/configuration

appId: site.daibao.cowatch
productName: CoWatch
copyright: Copyright © 2024 CoWatch

# 打包时包含的文件
files:
  - dist/**/*          # React 页面（webpack 产物）
  - dist-electron/**/* # Electron 主进程（webpack.electron.js 产物）
  - package.json

# 构建产物输出目录
directories:
  output: release
  buildResources: build  # 图标等资源放这里（build/icon.ico）

# ─── Windows 配置（上线目标平台）────────────────────────────────────────────
win:
  target:
    - target: nsis       # NSIS 安装包（.exe 安装程序）
      arch:
        - x64            # 64 位，覆盖 Win10/11 主流用户
  # 应用图标（需要在 build/icon.ico 放置，256x256 或更大）
  # icon: build/icon.ico
  # 跳过 exe 签名和资源编辑（避免从 GitHub 下载 winCodeSign；
  # todo：正式发布时删除此行）
  signAndEditExecutable: false
  # gyan.dev full build ffmpeg.exe，仅 Windows 打包时携带。
  # 来源：https://www.gyan.dev/ffmpeg/builds/ 下载 ffmpeg-release-full.7z，
  #       解压后取 bin/ffmpeg.exe 放入 electron/bin/（已内置 ddagrab/gfxcapture filter，无需自编译）。
  # electron/bin/ 目录不存在时此配置自动忽略，不影响打包。
  # getFfmpegPath() 在 packaged 模式下读取 resources/bin/ffmpeg.exe
  extraResources:
    - from: "electron/bin/"
      to: "bin/"
      filter:
        - "**/*"

# NSIS 安装包配置
nsis:
  # 单文件安装包（用户无需选择安装目录，一键安装）
  oneClick: true
  # 安装到用户目录（不需要管理员权限，避免 UAC 弹窗）
  perMachine: false
  # 安装完成后自动启动
  runAfterFinish: true
  # 创建桌面快捷方式
  createDesktopShortcut: true
  # 创建开始菜单快捷方式
  createStartMenuShortcut: true

# ─── 自动更新配置（GitHub Releases）────────────────────────────────────────
publish:
  provider: github
  # owner 和 repo 会从 package.json 的 repository 字段读取
  # 需要设置环境变量 GH_TOKEN 才能发布
  releaseType: release